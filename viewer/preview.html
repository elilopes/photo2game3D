<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pré-visualização 3D</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101722;color:#fff;font:14px system-ui}#info{position:fixed;top:12px;left:12px;background:#172333dd;padding:10px 14px;border-radius:8px;z-index:2}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/addons/"}}</script></head><body><div id="info">Carregando modelo 3D… arraste para orbitar · roda para zoom</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101722);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,1000);camera.position.set(2,2,3);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(4,8,5);scene.add(light);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const url=new URLSearchParams(location.search).get('url');
if(url)new GLTFLoader().load(url,g=>{scene.add(g.scene);const box=new THREE.Box3().setFromObject(g.scene);const center=box.getCenter(new THREE.Vector3());const size=box.getSize(new THREE.Vector3());g.scene.position.sub(center);const max=Math.max(size.x,size.y,size.z)||1;camera.position.set(max*1.8,max*1.4,max*2.1);controls.target.set(0,0,0);controls.update();document.querySelector('#info').textContent='Modelo carregado · '+url.split('/').pop();},undefined,e=>document.querySelector('#info').textContent='Falha ao carregar: '+e.message);
function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
