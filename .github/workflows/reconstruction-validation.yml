name: Validate reconstruction integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/multi-model-scene-reconstruction]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python modules
        run: python -m py_compile server.py image_to_3d.py model_manager.py model_comparator.py reconstruction_pipeline.py world_models.py
      - name: Check viewer JavaScript syntax
        run: node --check viewer/js/main.js
